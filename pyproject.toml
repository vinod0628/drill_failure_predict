[project]
name = "geoviewer"
version = "0.1.0"
description = "Read-only 3D viewer for Surpac geological data (strings, DTMs, block models, drillholes)"
requires-python = ">=3.10"
# Exact, tested versions for the offline install: requirements-offline.txt
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "vtk>=9.3",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "PySide6-Essentials>=6.6",
    "QtAwesome>=1.3",
    "ezdxf>=1.1",
    "access-parser>=0.0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geoviewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
